[pytest]
# Why this file exists: `pytest` and `python -m pytest` do NOT put the same
# things on sys.path, and this suite only worked under one of them.
#
# The tests import `server`, `finance`, `config` and friends, which live at the
# REPO ROOT. Under pytest's default "prepend" import mode, what gets added to
# sys.path is the basedir of each test module — for tests/test_*.py, with no
# __init__.py alongside them, that is `tests/`, not the root. The root only
# lands on the path when Python itself puts it there, which `python -m pytest`
# does (the -m switch prepends the CWD) and a bare `pytest` does not.
#
# So `python -m pytest` passed while `pytest` — the invocation documented in
# requirements-dev.txt, and the one CI ran — failed at conftest import with
# "No module named 'server'" and exit code 4 (pytest's USAGE_ERROR; a genuinely
# empty run is exit 5). `pythonpath` below makes the root explicit, so both
# invocations behave identically here, in CI and in an IDE's test runner.
pythonpath = .

# Collection starts at tests/ rather than the whole repo: without it a bare
# `pytest` also walks .venv/ and node_modules/ looking for test files.
testpaths = tests
