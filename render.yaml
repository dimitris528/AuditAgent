# Render Blueprint — lets Render create/build the service automatically from
# GitHub (New → Blueprint → point at this repo). Optional: you can instead
# create a Web Service by hand in the dashboard with runtime "Docker".
services:
  - type: web
    name: bakalocharto
    runtime: docker
    # Hobby workspace: "free" spins down after ~15 min idle (slow cold start
    # for the client); switch to "starter" for an always-on instance.
    plan: free
    autoDeploy: true
    healthCheckPath: /_stcore/health
    envVars:
      # sync: false → Render prompts for the value in the dashboard;
      # secrets never live in the repo.
      - key: OPENAI_API_KEY
        sync: false
      - key: AIRTABLE_PAT
        sync: false
      - key: AIRTABLE_BASE_ID
        sync: false
      # Password-reset emails ("Ξέχασα τον κωδικό μου"): a Gmail address and
      # its App Password (not the normal account password). Optional — leave
      # unset to disable the reset flow.
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # Table names default sensibly in config.py (Invoices / Projects /
      # Transactions / Users) — add AIRTABLE_*_TABLE vars here only if yours
      # are named differently.

  # Stripe webhook receiver (stripe_webhook.py) — Streamlit cannot accept
  # POSTs, so this runs as its own tiny service from the SAME image, with
  # the CMD overridden. Point the Stripe endpoint at
  #   https://<this service's host>/webhook
  # subscribed to checkout.session.completed. NOTE: on the free plan the
  # service spins down when idle — Stripe retries failed deliveries for up
  # to ~3 days so no event is lost, but activation can lag by the ~1 min
  # cold start; use "starter" for instant activation.
  - type: web
    name: bakalocharto-webhook
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /
    dockerCommand: gunicorn stripe_webhook:app --bind 0.0.0.0:$PORT
    envVars:
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: AIRTABLE_PAT
        sync: false
      - key: AIRTABLE_BASE_ID
        sync: false

  # ========================================================================
  # Web dashboard — two cooperating services:
  #   accounting-api  (FastAPI, server/main.py)  ← the data + auth API
  #   accounting-web  (Next.js, web/)            ← the dashboard UI
  # The browser only ever talks to accounting-web (same-origin); the Next
  # server calls accounting-api server-to-server with the tenant's Bearer
  # token, so no cross-origin CORS is needed in production.
  # ========================================================================

  # --- FastAPI backend (native Python runtime) ----------------------------
  - type: web
    name: accounting-api
    runtime: python
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Airtable creds (same base as the Streamlit app). sync:false → set in
      # the Render dashboard; never committed.
      - key: AIRTABLE_PAT
        sync: false
      - key: AIRTABLE_BASE_ID
        sync: false
      # JWT signing key — Render generates a strong random value and keeps it
      # stable across deploys.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_HOURS
        value: "12"
      # Live data only in production (no demo fallback).
      - key: DASHBOARD_DEMO
        value: "0"
      - key: DASHBOARD_TREND_MONTHS
        value: "12"

  # --- Next.js frontend (native Node runtime) -----------------------------
  - type: web
    name: accounting-web
    runtime: node
    plan: free
    autoDeploy: true
    rootDir: web
    healthCheckPath: /login
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      # Base URL of the API service. fromService injects the hostname; the app
      # upgrades a bare host to https (see web/src/lib/constants.ts → apiBase).
      - key: API_BASE_URL
        fromService:
          type: web
          name: accounting-api
          property: host
      - key: NODE_ENV
        value: production
