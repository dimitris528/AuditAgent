# Render Blueprint — New → Blueprint → point at this repo.
#
# Post-migration stack: Next.js + FastAPI only. The old Streamlit app and its
# standalone Flask Stripe webhook (Docker services) were retired and their code
# deleted; the Stripe webhook now lives INSIDE the FastAPI service at
# /api/v1/webhooks/stripe. Delete any leftover "bakalocharto" /
# "bakalocharto-webhook" services in the Render dashboard — removing them here
# stops the blueprint managing them but does not auto-delete existing services.
#
#   accounting-api  (FastAPI, server/main.py)  ← the data + auth API
#   accounting-web  (Next.js, web/)            ← the dashboard UI
#
# The browser only ever talks to accounting-web (same-origin); the Next server
# calls accounting-api server-to-server with the tenant's Bearer token, so no
# cross-origin CORS is needed in production.
services:
  # --- FastAPI backend (native Python runtime) ----------------------------
  - type: web
    name: accounting-api
    runtime: python
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Airtable credentials. sync:false → set in the Render dashboard; never
      # committed.
      # Supabase PostgreSQL connection string — the live data layer.
      #   postgresql://postgres.<ref>:<password>@<host>:6543/postgres
      # Use port 6543 (the transaction pooler) for this service.
      # PERCENT-ENCODE special characters in the password: / -> %2F, @ -> %40,
      # : -> %3A, ? -> %3F. An un-escaped "/" makes the URL reparse so the
      # password fragment is read as the port, and the failure looks like bad
      # credentials rather than a malformed URL.
      - key: DATABASE_URL
        sync: false
      # Airtable — MIGRATION ONLY. Nothing the API serves reads these any more;
      # they are needed solely by scripts/migrate_airtable_to_postgres.py. Once
      # the backfill has run against production, remove them.
      - key: AIRTABLE_PAT
        sync: false
      - key: AIRTABLE_BASE_ID
        sync: false
      # Stripe billing webhook signing secret (whsec_...). Point the Stripe
      # endpoint at https://<this service>/api/v1/webhooks/stripe and subscribe
      # it to checkout.session.completed. Unset => the endpoint returns 503
      # rather than trusting unverified payloads.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Anthropic key for the invoice-scan endpoint (POST
      # /api/v1/documents/scan). Unset => the endpoint returns 503 and the UI
      # hides the scan button; everything else works unchanged.
      - key: ANTHROPIC_API_KEY
        sync: false
      # JWT signing key — Render generates a strong random value and keeps it
      # stable across deploys.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_HOURS
        value: "12"
      # Live data only in production (no demo fallback).
      - key: DASHBOARD_DEMO
        value: "0"
      - key: DASHBOARD_TREND_MONTHS
        value: "12"

  # --- Next.js frontend (native Node runtime) -----------------------------
  - type: web
    name: accounting-web
    runtime: node
    plan: free
    autoDeploy: true
    rootDir: web
    healthCheckPath: /login
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      # Base URL of the API service. fromService injects the hostname; the app
      # upgrades a bare host to https (see web/src/lib/constants.ts → apiBase).
      - key: API_BASE_URL
        fromService:
          type: web
          name: accounting-api
          property: host
      - key: NODE_ENV
        value: production
