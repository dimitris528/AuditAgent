# Production stability behind Render's proxy: Render terminates TLS and
# proxies the WebSocket, so Streamlit's own CORS/XSRF checks and per-message
# compression cause spurious "Connection lost" drops — the proxy is the
# security boundary here.
[server]
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false
headless = true

# Native Streamlit theme — keeps BaseWeb widgets (dropdown popovers, date
# picker, dataframe) on-palette where CSS injection can't reach.
[theme]
base = "dark"
primaryColor = "#00E676"
backgroundColor = "#121214"
secondaryBackgroundColor = "#1C1C1E"
textColor = "#FFFFFF"
font = "sans serif"

[browser]
gatherUsageStats = false

# White-label: hide the developer toolbar / Deploy button for viewers.
[client]
toolbarMode = "minimal"
